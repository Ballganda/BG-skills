schema_version: "1.1"
name: grill-term-clash
description: A plan whose wording clashes with the fixture GLOSSARY.md. /grill must call out the clash and write the resolved term into GLOSSARY.md inline.
tags: [grill]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]

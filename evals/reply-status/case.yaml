schema_version: "1.1"
name: reply-status
description: A status reply after finished work, outside any skill, in a workspace whose CLAUDE.md holds the Replies line. The Reply must give the outcome first, then one fact per line.
tags: [reply]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep]
